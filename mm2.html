<style>
  :root {
    --bg:#0b0e14; --surface:#12161f; --surface-2:#1a2029; --border:#262d3a;
    --text:#e9edf4; --muted:#8a93a6; --muted-2:#5d6577;
    --accent:#d9a441; --accent-soft:#d9a44122;
    --green:#34c17a; --red:#e0576a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f4ee; --surface:#ffffff; --surface-2:#f0ede4; --border:#ded8c8;
      --text:#221d12; --muted:#6b6455; --muted-2:#98917f;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Manrope", -apple-system, "Segoe UI", sans-serif; }
  .tabular { font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1200px; margin:auto; padding:0 16px; }
  header { border-bottom:1px solid var(--border); background:var(--surface); }
  .top { display:flex; align-items:center; gap:14px; padding:14px 0; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
  .brand-mark { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#1a1405; display:grid; place-items:center; font:700 15px "Unbounded", sans-serif; }
  .brand-text { font:600 16px "Unbounded", sans-serif; }
  .dim { color:var(--muted); }
  .tabs { display:flex; gap:8px; padding:14px 0 4px; flex-wrap:wrap; }
  /* phones: the menu is one row you swipe sideways */
  @media (max-width:640px) {
    .tabs { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:12px 16px 6px; scroll-padding:0 16px; }
    .tabs::-webkit-scrollbar { display:none; }
    .tabs .tab { flex:none; white-space:nowrap; }
  }
  .tab { padding:7px 14px; border-radius:999px; border:1px solid var(--border); color:var(--muted); text-decoration:none; font-weight:700; font-size:13px; }
  .tab:hover { color:var(--text); border-color:var(--muted-2); }
  .tab.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; padding:12px 0; }
  .ranges { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:0 0 10px; font-size:12px; color:var(--muted); }
  .ranges label { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .ranges input { width:84px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:12px; }
  @media (max-width:640px) {
    .controls #q { flex:1 1 100%; }
    .controls select { flex:1 1 calc(50% - 4px); min-width:0; }
    .ranges { display:grid; grid-template-columns:1fr; gap:8px; }
    .ranges label { display:grid; grid-template-columns:64px 1fr auto 1fr; gap:6px; }
    .ranges input { width:100%; box-sizing:border-box; }
    .ranges-clear { justify-self:start; }
  }
  .ranges-clear { font:800 11px Manrope, sans-serif; padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
  input, select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font:inherit; }
  input { flex:1 1 220px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .stats { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; padding-bottom:10px; }
  .stats b { color:var(--text); }
  .stats-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-bottom:10px; }
  .stats-row .stats { padding-bottom:0; }
  .refresh { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font:700 12px "Manrope", sans-serif; cursor:pointer; }
  .refresh:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .refresh:disabled { opacity:.6; cursor:default; }
  #refresh-status { font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; padding-bottom:40px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-width:0; }
  /* card layout: picture + name/category/badges, then value + mini chart, then the price line - nothing overlaps */
  .c-top { display:flex; gap:10px; align-items:flex-start; min-width:0; }
  .c-id { min-width:0; flex:1; }
  .c-id .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-mid { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; min-width:0; }
  .c-mid > div { min-width:0; }
  .c-foot { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; font-size:12px; padding-top:8px; border-top:1px solid var(--border); }
  .card:hover { border-color:var(--accent); }
  .card img { width:56px; height:56px; object-fit:contain; flex:none; background:var(--surface-2); border-radius:10px; }
  .name { font-weight:800; }
  .cat { color:var(--muted); font-size:12px; text-transform:capitalize; }
  .val { font-size:17px; font-weight:700; margin-top:4px; color:var(--accent); }
  .chg { font-size:12px; }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:var(--muted-2); }
  dialog { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:16px; width:min(640px, calc(100% - 32px)); padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { font:600 18px "Unbounded", sans-serif; margin:0; }
  .dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0; }
  .dl dt { color:var(--muted); } .dl dd { margin:0; }
  svg.chart { width:100%; height:auto; display:block; background:var(--surface-2); border-radius:10px; touch-action:none; }
  svg.chart text { fill:var(--muted); font:11px "JetBrains Mono", monospace; }
  .chart-foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }
  .range-row { display:flex; gap:6px; margin-bottom:8px; }
  .fav-btn { font-size:22px; line-height:1; background:none; border:1px solid var(--border); border-radius:12px; padding:6px 10px; color:var(--muted); cursor:pointer; }
  .fav-btn.on { color:#f5b400; border-color:#f5b40088; }
  .d-actions { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .alert-btn { display:inline-block; padding:8px 14px; border-radius:999px; background:var(--accent); color:#120c22; font-weight:800; font-size:13px; text-decoration:none; }
  .mk-legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; margin-top:6px; }
  .mk-legend i { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .kind-row { display:flex; gap:6px; margin:4px 0 8px; }
  .kind { font:800 12px Manrope, sans-serif; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
  .kind.on { color:var(--text); border-color:var(--accent); background:var(--accent-soft); }
  .range { background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:3px 10px; font:700 12px inherit; cursor:pointer; }
  .range.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .card { position:relative; }
  .val.ratio { font-size:14px; }
  .val .unit { font-size:13px; }
  .pvs { display:flex; flex-direction:column; gap:2px; }
  .pv { font-size:12px; }
  .pv .dim { display:inline-block; min-width:28px; }
  .pv-note { font-size:11px; }
  .price { font-size:12px; margin-top:2px; color:var(--text); }
  .vpd { font-weight:700; }
  .periods { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding-bottom:10px; font-size:13px; }
  .periods button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:4px 12px; font:700 12px "Manrope", sans-serif; cursor:pointer; }
  .periods button.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .ptable { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:0 0 14px; }
  .ptable div { background:var(--surface-2); border-radius:10px; padding:8px; text-align:center; display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .ptable b { font-size:14px; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .tags .badge { margin-left:0; }
  svg.spark { flex:none; width:72px; height:30px; }
  .close { float:right; background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; }
  a { color:var(--accent); }
  .empty { color:var(--muted); padding:40px 16px; text-align:center; grid-column:1/-1; }

  /* ================= Design layer: glass, glow and motion ================= */
  :root { --accent-2:#f0c96b; --glow:#d9a44155; --glass:rgba(18,22,31,.62); --ease:cubic-bezier(.2,.8,.2,1); }
  html[data-game="bladeball"] { --accent:#5b9dff; --accent-2:#a77bff; --accent-soft:#5b9dff22; --glow:#5b9dff55; }
  html[data-game="adoptme"] { --accent:#ff7eb6; --accent-2:#ffb36b; --accent-soft:#ff7eb622; --glow:#ff7eb655; }
  html[data-game="stealabrainrot"] { --accent:#34d399; --accent-2:#a3e635; --accent-soft:#34d39922; --glow:#34d39955; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --glass:rgba(255,255,255,.7); } }

  body { min-height:100vh; overflow-x:hidden; }
  /* drifting colour glows + faint grid behind everything */
  body::before, body::after { content:""; position:fixed; z-index:-1; pointer-events:none; border-radius:50%; filter:blur(90px); opacity:.55; }
  body::before { width:620px; height:620px; top:-220px; left:-160px; background:radial-gradient(circle, var(--glow), transparent 70%); animation:drift1 26s ease-in-out infinite alternate; }
  body::after { width:560px; height:560px; bottom:-240px; right:-140px; background:radial-gradient(circle, color-mix(in srgb, var(--accent-2) 35%, transparent), transparent 70%); animation:drift2 32s ease-in-out infinite alternate; }
  .bg-grid { position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.35;
    background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:48px 48px; mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); }
  @keyframes drift1 { to { transform:translate(140px, 90px) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-120px, -70px) scale(1.1); } }

  /* sticky glass header */
  header { position:sticky; top:0; z-index:20; background:var(--glass); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); border-bottom:1px solid color-mix(in srgb, var(--border) 70%, transparent); }
  .brand-mark { background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 0 0 1px #ffffff14 inset, 0 6px 18px -6px var(--glow); position:relative; overflow:hidden; }
  .brand-mark::after { content:""; position:absolute; inset:0; background:linear-gradient(110deg, transparent 30%, #ffffff66 50%, transparent 70%); transform:translateX(-120%); animation:shine 5s var(--ease) infinite; }
  @keyframes shine { 0%, 70% { transform:translateX(-120%); } 100% { transform:translateX(120%); } }

  /* tabs */
  .tab { transition:color .2s, border-color .2s, background .2s, transform .2s var(--ease); background:color-mix(in srgb, var(--surface) 60%, transparent); }
  .tab:hover { transform:translateY(-1px); }
  .tab.active { background:linear-gradient(135deg, var(--accent-soft), transparent); box-shadow:0 0 18px -6px var(--glow); }

  /* hero */
  .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap; padding:22px 0 14px; animation:rise .6s var(--ease) both; }
  .hero h1 { margin:0; font:700 clamp(24px, 4vw, 38px)/1.1 "Unbounded", sans-serif; letter-spacing:-.02em;
    background:linear-gradient(100deg, var(--text) 10%, var(--accent) 55%, var(--accent-2) 90%); -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% 100%; animation:hue-slide 8s ease-in-out infinite alternate; }
  @keyframes hue-slide { to { background-position:100% 0; } }
  .hero p { margin:6px 0 0; }
  .tiles { display:grid; grid-template-columns:repeat(4, minmax(120px, 1fr)); gap:10px; flex:1 1 520px; max-width:720px; }
  .tile { background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-width:0;
    animation:rise .6s var(--ease) both; transition:transform .25s var(--ease), border-color .25s; }
  .tile:nth-child(2) { animation-delay:.06s; } .tile:nth-child(3) { animation-delay:.12s; } .tile:nth-child(4) { animation-delay:.18s; }
  .tile:hover { transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .tile span { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .tile b { font:700 19px "JetBrains Mono", monospace; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile b.small { font:700 14px "Manrope", sans-serif; }
  .tile small { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:640px) { .tiles { grid-template-columns:repeat(2, 1fr); } }

  /* control panel */
  .panel { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:16px; padding:12px 14px 2px; margin-bottom:14px; animation:rise .6s .1s var(--ease) both; }
  .controls { padding-top:0; }
  input, select { transition:border-color .2s, box-shadow .2s, background .2s; background:color-mix(in srgb, var(--surface) 80%, transparent); }
  input:focus, select:focus { box-shadow:0 0 0 3px var(--accent-soft), 0 0 22px -8px var(--glow); }
  .periods button, .range, .refresh { transition:all .2s var(--ease); }
  .periods button:hover, .range:hover { color:var(--text); border-color:var(--muted-2); }
  .periods button.on, .range.on { box-shadow:0 0 14px -6px var(--glow); }
  .refresh { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg, var(--accent-soft), transparent); border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .refresh:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 18px -8px var(--glow); }
  .refresh .ico { display:inline-block; }
  .refresh:disabled .ico { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #refresh-status:not(:empty) { padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--text); animation:pop .35s var(--ease); }

  /* cards */
  .grid { gap:12px; }
  .card { background:linear-gradient(160deg, color-mix(in srgb, var(--surface) 92%, var(--accent) 8%), var(--surface)); border-color:color-mix(in srgb, var(--border) 85%, transparent);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s; animation:rise .5s var(--ease) both; animation-delay:var(--d, 0ms); isolation:isolate; overflow:hidden; }
  .card::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; z-index:-1; opacity:0; transition:opacity .3s;
    background:linear-gradient(135deg, var(--accent), transparent 40%, transparent 60%, var(--accent-2));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
  .card::after { content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .3s; background:radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), var(--accent-soft), transparent 60%); }
  .card:hover { transform:translateY(-4px); box-shadow:0 18px 40px -22px var(--glow), 0 8px 18px -12px #000a; border-color:transparent; }
  .card:hover::before, .card:hover::after { opacity:1; }
  .card img { transition:transform .45s var(--ease); background:radial-gradient(circle at 50% 40%, var(--accent-soft), var(--surface-2) 70%); }
  .card:hover img { transform:scale(1.08) rotate(-2deg); }
  .card:active { transform:translateY(-1px) scale(.99); }
  .badge { display:inline-block; vertical-align:1px; margin-left:4px; font:800 10px "Manrope", sans-serif; letter-spacing:.04em; padding:3px 8px; border-radius:999px;
    color:#1b1305; background:linear-gradient(135deg, #ffb347, #ff6a3d); box-shadow:0 4px 14px -4px #ff6a3d99; animation:pulse 2.4s ease-in-out infinite; }
  .badge.token { color:#191300; background:linear-gradient(135deg, #ffe27a, #f5b400); box-shadow:0 4px 14px -4px #f5b40099; animation:none; }
  @keyframes pulse { 50% { box-shadow:0 4px 22px -2px #ff6a3dcc; transform:scale(1.05); } }
  .val { background:linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .val .unit { -webkit-text-fill-color:initial; }
  .rise { display:inline-block; font-size:12px; animation:pulse 2.4s ease-in-out infinite; }
  svg.spark polyline { stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s .2s var(--ease) forwards; }

  /* skeleton loading */
  .skel { height:96px; border-radius:14px; border:1px solid var(--border);
    background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size:300% 100%; animation:shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { from { background-position:100% 0; } to { background-position:0 0; } }

  /* detail dialog */
  dialog { border-color:color-mix(in srgb, var(--accent) 30%, var(--border)); box-shadow:0 30px 80px -30px #000, 0 0 60px -30px var(--glow);
    background:linear-gradient(170deg, color-mix(in srgb, var(--surface) 90%, var(--accent) 10%), var(--surface) 40%); }
  dialog[open] { animation:zoom .35s var(--ease); }
  dialog::backdrop { background:rgba(4,6,10,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fade .3s; }
  .d-head { display:flex; gap:14px; align-items:center; margin-bottom:4px; }
  .d-head img { width:84px; height:84px; object-fit:contain; border-radius:16px; background:radial-gradient(circle at 50% 40%, var(--accent-soft), var(--surface-2) 70%); animation:float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-4px) rotate(1deg); } }
  .ptable div { transition:transform .2s var(--ease); } .ptable div:hover { transform:translateY(-2px); }
  .close { transition:transform .2s, color .2s; } .close:hover { transform:rotate(90deg); color:var(--text); }
  svg.chart .line { stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.1s var(--ease) forwards; }
  svg.chart .area { opacity:0; animation:fade .8s .5s forwards; }

  /* back to top */
  .to-top { position:fixed; right:18px; bottom:18px; z-index:15; width:42px; height:42px; border-radius:50%; border:1px solid var(--border); cursor:pointer;
    background:var(--glass); backdrop-filter:blur(10px); color:var(--text); font-size:18px; opacity:0; transform:translateY(12px); pointer-events:none; transition:all .3s var(--ease); }
  .to-top.show { opacity:1; transform:none; pointer-events:auto; }
  .to-top:hover { border-color:var(--accent); box-shadow:0 0 20px -6px var(--glow); }

  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:none; } }
  @keyframes zoom { from { opacity:0; transform:translateY(10px) scale(.96); } to { opacity:1; transform:none; } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    svg.spark polyline, svg.chart .line { stroke-dasharray:none; stroke-dashoffset:0; }
    svg.chart .area { opacity:1; }
  }
  .depth { margin:14px 0 4px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.03); border:1px solid var(--border); }
  .depth-h { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:13px; margin-bottom:8px; }

<script>
/*GAME_CONFIG*/
const GAME = window.GAME || { api: "/api/mm2", title: "MM2 Values", tab: "mm2", noun: "MM2 weapons", sourceName: "supremevalues.com",
  sourceUrl: "https://supremevalues.com/mm2", shopUrl: "https://www.eldorado.gg/mm2-shop/i/204-2-0" };
document.title = `${GAME.title} · Agony Values`;
document.documentElement.dataset.game = GAME.tab; // per-game accent colours
document.getElementById("hero-title").textContent = GAME.title;
document.getElementById("hero-sub").textContent = `Live ${GAME.noun} values from ${GAME.sourceName}, with Eldorado.gg prices.`;
document.querySelectorAll(".tab[data-tab]").forEach((t) => t.classList.toggle("active", t.dataset.tab === GAME.tab));
document.getElementById("q").placeholder = `Search ${GAME.noun}…`;
let items = [];
// Detail rows are left out when the values site doesn't provide that field.
// "og" -> "OG", "pet wear" -> "Pet wear"
const catLabel = (c) => (c.length <= 2 ? c.toUpperCase() : c[0].toUpperCase() + c.slice(1));
// "Eldorado price vs." row: today's cheapest price against 7d / 30d / 6 months / 1 year ago.
function priceVsRow(i) {
  const labels = { "7d": "7d", "30d": "30d", "6m": "6M", "1y": "1Y" };
  const cells = Object.entries(labels).map(([k, label]) => {
    const c = i.priceChanges?.[k];
    if (!c) return `<span class="pv"><span class="dim">${label}</span> —</span>`;
    const dir = c.pct > 0 ? "down" : c.pct < 0 ? "up" : "flat"; // cheaper is good for buyers
    return `<span class="pv"><span class="dim">${label}</span> ${usd(c.then)} → ${usd(i.usd)} <b class="${dir}">${c.pct > 0 ? "+" : ""}${c.pct}%</b></span>`;
  }).join("");
  return `<dt>Eldorado price vs.</dt><dd class="tabular pvs">${cells}${Object.keys(i.priceChanges || {}).length ? "" : `<span class="dim pv-note">Tracked from now on — 7d fills in after a week.</span>`}</dd>`;
}
const GAME_NAME = { mm2: "MM2", bladeball: "Blade Ball", adoptme: "Adopt Me", stealabrainrot: "Steal a Brainrot" };
const row = (label, html) => (html ? `<dt>${label}</dt><dd>${html}</dd>` : "");
let period = "7d";
let medianVpd = 0;
const usd = (n) => "$" + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const fmtVpd = (n) => !(n > 0) ? "—" : n >= 100 ? Math.round(n).toLocaleString() : n >= 1 ? n.toFixed(1) : Number(n.toPrecision(2)).toString();
// Green = more value per dollar than the typical weapon, red = less.
const vpdClass = (n) => !medianVpd ? "" : n >= medianVpd * 1.25 ? "up" : n <= medianVpd * 0.75 ? "down" : "flat";
const PERIOD_LABEL = { "24h": "24h", "7d": "7 days", "30d": "30 days", "1y": "1 year", all: "all time" };
const chg = (i) => i.changes?.[period];
function changeText(c) {
  if (!c || !c.abs) return "No change";
  return `${c.abs > 0 ? "+" : ""}${fmt(c.abs)} (${c.pct > 0 ? "+" : ""}${c.pct}%)`;
}
const $ = (id) => document.getElementById(id);
const fmt = (n) => n == null ? "N/A" : n.toLocaleString();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cls = (n) => n > 0 ? "up" : n < 0 ? "down" : "flat";

// Animated number for the hero tiles.
function countUp(el, to, format = (n) => Math.round(n).toLocaleString()) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = format(to); return; }
  const from = Number(el.dataset.n || 0), t0 = performance.now(), dur = 900;
  el.dataset.n = to;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = format(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const ago = (iso) => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return !iso ? "—" : m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
};
// How many times better an item's value per $ is than items of similar value (within 2x) -
// the same rule the Discord deal alerts use. dealX[key] >= 2.5 is a deal.
let dealX = {};
function computeDeals() {
  dealX = {};
  const priced = items.filter((i) => i.valuePerUsd > 0 && i.usd > 0).sort((a, b) => a.value - b.value);
  let lo = 0, hi = 0;
  for (const i of priced) {
    while (priced[lo].value < i.value / 2) lo++;
    while (hi < priced.length && priced[hi].value <= i.value * 2) hi++;
    if (i.usd < 3 || (i.listings ?? 0) < 2 || hi - lo - 1 < 6) continue;
    const peers = priced.slice(lo, hi).filter((p) => p !== i).map((p) => p.valuePerUsd).sort((a, b) => a - b);
    dealX[i.key] = i.valuePerUsd / peers[peers.length >> 1];
  }
}
const isDeal = (i) => (dealX[i.key] || 0) >= 2.5;
// "Rising, price lagging": the value went up recently (+10% in 24h or +20% in 7 days) but the item
// is still cheap on Eldorado compared with similar-value items - sellers haven't repriced yet.
// Blade Ball: cheaper than buying the same value in tokens (Eldorado's recommended token price).
let tokenPerUsd = 0;
const beatsTokens = (i) => tokenPerUsd > 0 && i.valuePerUsd > tokenPerUsd;
const isRising = (i) => i.usd > 0 && (dealX[i.key] || 0) >= 1.5
  && ((i.changes?.["24h"]?.pct ?? 0) >= 10 || (i.changes?.["7d"]?.pct ?? 0) >= 20);

function fillHero(data) {
  countUp($("t-items"), items.length);
  $("t-items-sub").textContent = `${(data.categories || []).length} categories`;
  const priced = items.filter((i) => i.usd).length;
  countUp($("t-priced"), priced);
  $("t-priced-sub").textContent = priced ? `typical ${fmtVpd(medianVpd)} value / $` : "no prices yet";
  const best = items.filter(isDeal).sort((a, b) => dealX[b.key] - dealX[a.key])[0];
  $("t-deal").textContent = best ? best.name : "None right now";
  $("t-deal-sub").textContent = best ? `${usd(best.usd)} · ${dealX[best.key].toFixed(1)}× similar items` : "checked every 15 min";
  $("t-updated").textContent = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—";
  $("t-updated-sub").textContent = data.pricesUpdatedAt ? `prices ${ago(data.pricesUpdatedAt)}` : " ";
}

let lastUpdatedAt = null;
let lastPricesAt = null;
async function load() {
  try {
    const data = await fetch(GAME.api).then((r) => r.json());
    lastUpdatedAt = data.updatedAt;
    lastPricesAt = data.pricesUpdatedAt;
    items = data.items || [];
    if (!items.length) { $("grid").innerHTML = `<div class="empty">${esc(data.error || "No values yet.")}</div>`; return; }
    const vpds = items.map((i) => i.valuePerUsd).filter(Boolean).sort((a, b) => a - b);
    medianVpd = vpds.length ? vpds[vpds.length >> 1] : 0;
    const cat = $("cat");
    if (cat.options.length === 3) for (const c of data.categories) cat.add(new Option(catLabel(c), c));
    $("stats").innerHTML = `<span><b>${items.length}</b> items</span><span>Updated <b>${new Date(data.updatedAt).toLocaleTimeString()}</b></span><span>Values from <a href="${esc(GAME.sourceUrl)}" target="_blank" rel="noopener">${esc(data.source)}</a></span>${data.pricesUpdatedAt ? `<span>Prices from <a href="${esc(GAME.shopUrl)}" target="_blank" rel="noopener">Eldorado.gg</a> · ${new Date(data.pricesUpdatedAt).toLocaleTimeString()}</span><span>Typical: <b>${fmtVpd(medianVpd)}</b> value per $</span>` : ""}${data.tokenRate ? `<span title="Cheapest of all marketplaces on the Currency page${data.tokenRate.eldoradoPer1k ? ` (Eldorado recommended: $${data.tokenRate.eldoradoPer1k.toFixed(2)} / 1k)` : ""}">🪙 Tokens: <b>$${data.tokenRate.per1k.toFixed(2)}</b> / 1k on <a href="${esc(data.tokenRate.url || "/currency")}" target="_blank" rel="noopener">${esc(data.tokenRate.market || "Eldorado")}</a> · <b>${data.tokenRate.perUsd}</b> per $ · <a href="/currency">compare</a></span>` : ""}`;
    tokenPerUsd = data.tokenRate?.perUsd || 0;
    if (tokenPerUsd && !$("cat").querySelector('option[value="tokens"]')) $("cat").querySelector('option[value="rising"]').insertAdjacentHTML("afterend", '<option value="tokens">🪙 Cheaper than tokens</option>');
    computeDeals();
    fillHero(data);
    render();
  } catch (e) {
    $("grid").innerHTML = `<div class="empty">Couldn't load values: ${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $("q").value.toLowerCase(), c = $("cat").value, s = $("sort").value;
  // "Best deals": more value per $ than the typical item (25%+ above the median), best first.
  const deals = c === "deals";
  // value / price ranges (empty = no limit); a price range hides items with no Eldorado price
  const num = (id) => { const x = $(id).value.trim(); return x === "" ? null : Number(x); };
  const [vmin, vmax, pmin, pmax, lmin, lmax] = ["vmin", "vmax", "pmin", "pmax", "lmin", "lmax"].map(num);
  $("ranges-clear").hidden = [vmin, vmax, pmin, pmax, lmin, lmax].every((x) => x == null);
  const inRange = (i) => (vmin == null || i.value >= vmin) && (vmax == null || i.value <= vmax)
    && ((pmin == null && pmax == null) || (i.usd > 0 && (pmin == null || i.usd >= pmin) && (pmax == null || i.usd <= pmax)))
    // listings: how many Eldorado listings the item has right now (none listed counts as 0)
    && (lmin == null || (i.listings || 0) >= lmin) && (lmax == null || (i.listings || 0) <= lmax);
  const list = items.filter((i) => (!q || i.name.toLowerCase().includes(q)) && inRange(i)
    && (deals ? isDeal(i) : c === "rising" ? isRising(i) : c === "tokens" ? beatsTokens(i) : !c || i.category === c));
  const v = (x) => x ?? -Infinity;
  const sorters = {
    value: (a, b) => v(b.value) - v(a.value), valueAsc: (a, b) => v(a.value) - v(b.value),
    change: (a, b) => v(chg(b)?.pct) - v(chg(a)?.pct), changeAsc: (a, b) => (chg(a)?.pct ?? 0) - (chg(b)?.pct ?? 0),
    demand: (a, b) => v(b.demand) - v(a.demand),
    vpd: (a, b) => v(b.valuePerUsd) - v(a.valuePerUsd), usdAsc: (a, b) => (a.usd ?? Infinity) - (b.usd ?? Infinity), name: (a, b) => a.name.localeCompare(b.name),
  };
  const byDeal = (a, b) => dealX[b.key] - dealX[a.key];
  list.sort((deals || c === "rising") && s === "value" ? byDeal : sorters[s]);
  const cardHtml = (i, n) => `
    <div class="card" data-key="${esc(i.key)}" style="--d:${Math.min(n, 24) * 28}ms">
      <div class="c-top">
        <img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.visibility='hidden'">
        <div class="c-id">
          <div class="name" title="${esc(i.name)}">${esc(i.name)}${isRising(i) ? ` <span class="rise" title="Value up recently, still cheap on Eldorado">📈</span>` : ""}</div>
          <div class="cat">${esc(catLabel(i.category))}${i.stability ? ` · ${esc(i.stability)}` : ""}</div>
          ${tags(i)}
        </div>
      </div>
      <div class="c-mid">
        <div>
          <div class="val tabular${i.valueText ? " ratio" : ""}">${i.valueText ? esc(i.valueText) : fmt(i.value)}${GAME.unit ? ` <span class="unit">${esc(GAME.unit)}</span>` : ""}</div>
          <div class="chg tabular ${cls(chg(i)?.abs)}">${i.valueText ? `<span class="dim">${/not valued/i.test(i.valueText) ? "Price tracked, value coming" : "Trade value"}</span>` : `<span class="dim">${period}</span> ${changeText(chg(i))}`}</div>
        </div>
        ${spark(i.spark)}
      </div>
      ${i.usd ? `<div class="c-foot tabular"><b>${usd(i.usd)}</b>${i.valuePerUsd > 0 ? `<span class="vpd ${vpdClass(i.valuePerUsd)}">${fmtVpd(i.valuePerUsd)} / $</span>` : ""}${i.listings ? `<span class="dim" title="Listings on Eldorado right now">${i.listings} listed</span>` : ""}</div>` : `<div class="c-foot dim">Not on Eldorado right now</div>`}
    </div>`;
  showChunks(list, cardHtml);
}

// Draw the first cards right away and the rest as you scroll (thousands of cards at once froze phones).
const CHUNK = 60;
let chunkObs = null;
function showChunks(list, cardHtml) {
  const grid = $("grid");
  chunkObs?.disconnect();
  if (!list.length) { grid.innerHTML = `<div class="empty">Nothing matches.</div>`; return; }
  let shown = Math.min(CHUNK, list.length);
  grid.innerHTML = list.slice(0, shown).map(cardHtml).join("");
  if (shown >= list.length) return;
  const more = document.createElement("div");
  more.className = "more-sentinel"; more.style.cssText = "grid-column:1/-1;height:1px";
  grid.appendChild(more);
  chunkObs = new IntersectionObserver((es) => {
    if (!es[0].isIntersecting) return;
    const next = list.slice(shown, shown + CHUNK * 2);
    more.insertAdjacentHTML("beforebegin", next.map((i, n) => cardHtml(i, n)).join(""));
    shown += next.length;
    if (shown >= list.length) { chunkObs.disconnect(); more.remove(); }
  }, { rootMargin: "1200px 0px" });
  chunkObs.observe(more);
}

// Mini 90-day trend line on each card, coloured by direction.
// Badges in the card's top-right corner (the sparkline sits bottom-right).
// Blade Ball: the item's price per 1k tokens of value, next to what 1k tokens cost on Eldorado.
function tags(i) {
  const out = [];
  if (isDeal(i)) out.push(`<span class="badge" title="${dealX[i.key].toFixed(1)}× better value per $ than similar items">🔥 DEAL</span>`);
  if (beatsTokens(i)) {
    const per1k = i.usd / i.value * 1000, market = 1000 / tokenPerUsd;
    out.push(`<span class="badge token" title="This item costs $${per1k.toFixed(2)} per 1k tokens of value — 1k tokens cost $${market.toFixed(2)} on the cheapest marketplace (${(market / per1k).toFixed(1)}× more)">🪙 $${per1k < 1 ? per1k.toFixed(2) : per1k.toFixed(per1k < 10 ? 2 : 1)}/1k</span>`);
  }
  return out.length ? `<div class="tags">${out.join("")}</div>` : "";
}

function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const W = 70, H = 30, lo = Math.min(...vals), hi = Math.max(...vals);
  const pts = vals.map((v, k) => `${(k / (vals.length - 1) * W).toFixed(1)},${(H - 2 - (v - lo) / (hi - lo || 1) * (H - 4)).toFixed(1)}`).join(" ");
  const dir = vals[vals.length - 1] - vals[0];
  const color = dir > 0 ? "var(--green)" : dir < 0 ? "var(--red)" : "var(--muted-2)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" pathLength="1" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

const RANGES = [["1M", 30], ["3M", 90], ["1Y", 365], ["All", 0]];
const shortNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n.toLocaleString();

// fmtY: axis/readout format; points: [[ms, y], ...]
function chartView(allPoints, days, fmtY = shortNum, emptyMsg = "No value history for this item yet — it fills in as values change.") {
  if (allPoints.length < 1) return `<p class="dim">${emptyMsg}</p>`;
  if (allPoints.length === 1) allPoints = [[allPoints[0][0] - 3600e3, allPoints[0][1]], allPoints[0]];
  let points = allPoints;
  if (days) {
    const cutoff = Date.now() - days * 864e5;
    const before = allPoints.filter((p) => p[0] < cutoff).pop();
    points = [...(before ? [[cutoff, before[1]]] : []), ...allPoints.filter((p) => p[0] >= cutoff)];
  }
  points = [...points, [Date.now(), points[points.length - 1][1]]]; // hold the current value up to today
  const W = 600, H = 220, L = 52, R = 10, T = 10, B = 26;
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 = Math.max(0, y0 * 0.9); y1 = y1 * 1.1 || 1; }
  const sx = (x) => L + (x - x0) / (x1 - x0 || 1) * (W - L - R);
  const sy = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let d = `M${sx(xs[0])},${sy(ys[0])}`;
  for (let k = 1; k < points.length; k++) d += `H${sx(xs[k])}V${sy(ys[k])}`; // step: value holds until it changes
  const area = `${d}V${H - B}H${sx(xs[0])}Z`;
  const grid = [0, 0.5, 1].map((f) => {
    const v = y0 + (y1 - y0) * f, y = sy(v);
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtY(v)}</text>`;
  }).join("");
  const dfmt = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: days && days <= 90 ? undefined : "2-digit" });
  const first = ys[0], last = ys[ys.length - 1], pct = first ? (last - first) / first * 100 : 0;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-x0="${x0}" data-x1="${x1}">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <path class="area" d="${area}" fill="url(#g)"/>
      <path class="line" d="${d}" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="${L}" y="${H - 6}">${dfmt(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text>
      <line id="cursor" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    </svg>
    <div class="chart-foot tabular"><span id="hover-read">${fmtY(first)} → ${fmtY(last)}</span><span class="${cls(pct)}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span></div>`;
}

// Two charts in the item preview: the value (from the values site) and the cheapest Eldorado price
// (tracked by us: a point every hour for the last 3 days, then one a day).
const valueFmt = (v) => shortNum(Math.round(v));
const priceFmt = (v) => (v >= 100 ? "$" + Math.round(v).toLocaleString() : "$" + v.toFixed(2));
// several marketplaces' prices as lines on one chart
const MARKET_COLORS = { Eldorado: "#f5b400", G2G: "#ef4444", U7BUY: "#f97316", GameBoost: "#a78bfa", Itemku: "#22d3ee" };
function marketsChartView(series, days) {
  const cutoff = days ? Date.now() - days * 864e5 : 0;
  const lines = series.map((s) => ({ ...s, points: [...s.points.filter((p) => p[0] >= cutoff), [Date.now(), s.points[s.points.length - 1][1]]] })).filter((s) => s.points.length);
  const all = lines.flatMap((s) => s.points);
  if (!all.length) return `<p class="dim">No marketplace history yet.</p>`;
  const W = 600, H = 220, L = 52, R = 10, T = 10, B = 26;
  const x0 = Math.min(...all.map((p) => p[0])), x1 = Date.now();
  let y0 = Math.min(...all.map((p) => p[1])), y1 = Math.max(...all.map((p) => p[1]));
  if (y0 === y1) { y0 *= 0.9; y1 = y1 * 1.1 || 1; }
  const sx = (x) => L + (x - x0) / (x1 - x0 || 1) * (W - L - R), sy = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const grid = [0, 0.5, 1].map((f) => { const v = y0 + (y1 - y0) * f, y = sy(v); return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${priceFmt(v)}</text>`; }).join("");
  const paths = lines.map((s) => { let d = `M${sx(s.points[0][0])},${sy(s.points[0][1])}`; for (let k = 1; k < s.points.length; k++) d += `H${sx(s.points[k][0])}V${sy(s.points[k][1])}`;
    return `<path d="${d}" fill="none" stroke="${MARKET_COLORS[s.name] || "#888"}" stroke-width="2" vector-effect="non-scaling-stroke"/>`; }).join("");
  const legend = lines.map((s) => `<span><i style="background:${MARKET_COLORS[s.name] || "#888"}"></i>${esc(s.name)} ${priceFmt(s.points[s.points.length - 1][1])}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${paths}<text x="${L}" y="${H - 6}">${new Date(x0).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text></svg>
    <div class="mk-legend">${legend}</div>`;
}

function mountChart(valuePoints, pricePoints = null, marketSeries = null) {
  let days = 365, kind = valuePoints.length ? "value" : "price";
  const draw = () => {
    const pts = kind === "value" ? valuePoints : pricePoints;
    const fmtY = kind === "value" ? valueFmt : priceFmt;
    const tabs = pricePoints ? `<div class="kind-row"><button class="kind${kind === "value" ? " on" : ""}" data-kind="value">Value</button><button class="kind${kind === "price" ? " on" : ""}" data-kind="price">Eldorado price</button>${marketSeries ? `<button class="kind${kind === "markets" ? " on" : ""}" data-kind="markets">All marketplaces</button>` : ""}</div>` : "";
    if (kind === "markets") {
      $("hist").innerHTML = `${tabs}<div class="range-row">${RANGES.map(([l, n]) => `<button class="range${n === days ? " on" : ""}" data-days="${n}">${l}</button>`).join("")}</div>${marketsChartView(marketSeries, days)}`;
      return;
    }
    const note = kind === "price" && pricePoints.length && Date.now() - pricePoints[0][0] < 7 * 864e5
      ? `<p class="dim" style="font-size:11px;margin:6px 0 0">Price tracking started ${new Date(pricePoints[0][0]).toLocaleDateString()} — the chart grows every hour.</p>` : "";
    $("hist").innerHTML = `${tabs}<div class="range-row">${RANGES.map(([l, n]) => `<button class="range${n === days ? " on" : ""}" data-days="${n}">${l}</button>`).join("")}</div>${chartView(pts, days, fmtY, kind === "value" ? undefined : "No Eldorado price history yet.")}${note}`;
    const points = pts;
    const svg = $("hist").querySelector("svg.chart"); if (!svg) return;
    const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, read = $("hover-read"), base = read.textContent, cursor = svg.querySelector("#cursor");
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * 600;
      const t = x0 + Math.min(1, Math.max(0, (fx - 52) / (600 - 62))) * (x1 - x0);
      const p = points.filter((q) => q[0] <= t).pop() || points[0];
      cursor.setAttribute("x1", Math.max(52, fx)); cursor.setAttribute("x2", Math.max(52, fx)); cursor.setAttribute("visibility", "visible");
      read.textContent = `${new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: kind === "price" ? "2-digit" : undefined })} · ${(kind === "value" ? valueFmt : priceFmt)(p[1])}`;
    });
    svg.addEventListener("pointerleave", () => { cursor.setAttribute("visibility", "hidden"); read.textContent = base; });
  };
  $("hist").onclick = (e) => {
    const b = e.target.closest(".range"); if (b) { days = +b.dataset.days; draw(); }
    const k = e.target.closest(".kind"); if (k) { kind = k.dataset.kind; draw(); }
  };
  draw();
}

// Market depth: how many units are listed at each price (from the last Eldorado check).
async function loadDepth(i) {
  const d = await fetch(`/api/depth?game=${encodeURIComponent(GAME_NAME[GAME.tab])}&key=${encodeURIComponent(i.key)}`).then((r) => r.json()).catch(() => null);
  const el = $("depth"); if (!el || !d?.offers?.length) return;
  const offers = d.offers; // [usd, units], cheapest first
  // group into price steps: each distinct price, or 10 ranges when there are many
  const distinct = [...new Set(offers.map((o) => o[0]))];
  let rows;
  if (distinct.length <= 12) rows = distinct.map((p) => ({ lo: p, hi: p, units: offers.filter((o) => o[0] === p).reduce((a, o) => a + o[1], 0), n: offers.filter((o) => o[0] === p).length }));
  else {
    const lo = offers[0][0], hi = offers.at(-1)[0], k = Math.pow(hi / lo, 1 / 10);
    rows = Array.from({ length: 10 }, (_, b) => ({ lo: lo * k ** b, hi: lo * k ** (b + 1) }));
    for (const r of rows) { const inR = offers.filter((o, j) => o[0] >= r.lo && (o[0] < r.hi || (r === rows.at(-1) && o[0] <= r.hi))); r.units = inR.reduce((a, o) => a + o[1], 0); r.n = inR.length; }
    rows = rows.filter((r) => r.n);
  }
  const max = Math.max(...rows.map((r) => r.units));
  let cum = 0;
  const units = offers.reduce((a, o) => a + o[1], 0);
  // cost of buying the cheapest 1 / 3 / 5 units
  const costOf = (n) => { let left = n, cost = 0; for (const [p, u] of offers) { const t = Math.min(u, left); cost += t * p; left -= t; if (!left) break; } return left ? null : cost; };
  const buys = [1, 3, 5, 10].map((n) => [n, costOf(n)]).filter(([, c]) => c != null);
  el.innerHTML = `<div class="depth"><div class="depth-h"><b>Market depth</b><span class="dim">${fmt(units)} units in ${fmt(offers.length)} listings${d.complete ? "" : " (cheapest page)"}</span></div>
    ${rows.map((r) => { cum += r.units; return `<div class="depth-row"><span class="tabular">${r.lo === r.hi ? usd(r.lo) : `${usd(r.lo)}–${usd(r.hi)}`}</span><div class="depth-bar"><i style="width:${Math.max(3, r.units / max * 100)}%"></i></div><span class="tabular">${fmt(r.units)}<span class="dim"> · ${fmt(cum)}</span></span></div>`; }).join("")}
    <div class="depth-buy">${buys.map(([n, c]) => `<span>Buy ${n}: <b class="tabular">${usd(c)}</b><span class="dim"> (avg ${usd(c / n)})</span></span>`).join("")}</div></div>`;
}

$("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card"); if (!card) return;
  openItem(card.dataset.key);
});
// The item preview; also opened from a link (?item=<key>) - global search, favourites, home page.
async function openItem(key) {
  const i = items.find((x) => x.key === key);
  if (!i) return;
  const favKey = `${GAME_NAME[GAME.tab]}|${i.key}`;
  $("detail").innerHTML = `<div class="d-head">${i.image ? `<img src="${esc(i.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<div style="flex:1"><h2>${esc(i.name)}</h2><div class="cat">${esc(catLabel(i.category))}</div></div>
    <button class="fav-btn${window.avFavs?.has(favKey) ? " on" : ""}" id="fav-btn" type="button" title="Favourite">${window.avFavs?.has(favKey) ? "★" : "☆"}</button></div>
    <dl class="dl"><dt>Value</dt><dd class="tabular">${i.valueText ? esc(i.valueText) : fmt(i.value)}${GAME.unitName ? ` ${esc(GAME.unitName)}` : ""}</dd>${row("Range", i.range && i.range !== "[N/A]" ? esc(i.range) : "")}
    ${row("Stability", esc(i.stability))}${row("Demand", i.demand != null ? fmt(i.demand) : "")}
    <dt>Rarity</dt><dd>${fmt(i.rarity)}</dd>
    ${(i.extra || []).map(([k, val]) => `<dt>${esc(k)}</dt><dd class="tabular">${esc(val)}</dd>`).join("")}
    ${i.usd ? `<dt>Eldorado</dt><dd class="tabular">${usd(i.usd)} cheapest${i.priceVariant ? ` (${esc(i.priceVariant)})` : ""} · ${fmt(i.listings)} listings · <a href="${esc(i.eldoradoUrl)}" target="_blank" rel="noopener">view</a></dd>
    ${priceVsRow(i)}
    <dt>Sold on Eldorado</dt><dd class="tabular">${i.sold7d ? `${fmt(i.sold24h)} in 24h · ${fmt(i.sold7d)} in 7d${i.soldPrice ? ` · typical sale ${usd(i.soldPrice)}` : ""}` : `<span class="dim">none seen yet — sales are tracked from now on</span>`}</dd>
    <dt>Value per $</dt><dd class="tabular ${vpdClass(i.valuePerUsd)}">${fmtVpd(i.valuePerUsd)} <span class="dim">(typical ${fmtVpd(medianVpd)})</span></dd>` : ""}${row("Origin", esc(i.origin))}
    </dl>
    ${i.valueText ? `<p class="dim">${/not valued/i.test(i.valueText) ? "New item — mm2values hasn't given it a value yet. Its Eldorado price is tracked already." : "This item is valued as a trade ratio, so there's no number to chart."}</p>` : `<div class="ptable">${Object.keys(PERIOD_LABEL).map((p) => `<div><span class="dim">${p === "all" ? "All" : p}</span><b class="tabular ${cls(i.changes?.[p]?.abs)}">${i.changes?.[p] ? (i.changes[p].pct > 0 ? "+" : "") + i.changes[p].pct + "%" : "—"}</b></div>`).join("")}</div>`}
    <div id="depth"></div>
    <div id="hist" class="dim">Loading history…</div>
    <p class="d-actions"><a class="alert-btn" href="/alerts?${new URLSearchParams({ game: GAME_NAME[GAME.tab] || "", key: i.key, name: i.name, image: i.image || "", usd: i.usd || "" })}">🔔 Alert me when it's cheaper</a>
      <a href="${esc(i.sourceUrl)}" target="_blank" rel="noopener">View on ${esc(GAME.sourceName)}</a></p>`;
  $("dlg").showModal();
  if (i.usd) loadDepth(i);
  if (i.valueText && !i.usd) { $("hist").innerHTML = ""; return; }
  const h = await fetch(GAME.api + "/history?key=" + encodeURIComponent(i.key)).then((r) => r.json()).catch(() => ({ points: [] }));
  // Eldorado price: stored points ([day number, usd]) plus the live price now
  const pricePts = i.usd ? [...(h.pricePoints || []).map(([d, v]) => [d * 864e5, v]), [Date.now(), i.usd]] : null;
  // other marketplaces' price history, drawn with Eldorado's on one chart
  const mh = await fetch(`/api/market-history?game=${encodeURIComponent(GAME_NAME[GAME.tab])}&key=${encodeURIComponent(i.key)}`).then((r) => r.json()).catch(() => ({ markets: {} }));
  const series = pricePts ? [{ name: "Eldorado", points: pricePts }] : [];
  for (const [m, pts] of Object.entries(mh.markets || {})) series.push({ name: m, points: pts.map(([d, v]) => [d * 864e5, v]) });
  mountChart(h.points || [], pricePts, series.length > 1 ? series : null);
  $("fav-btn").onclick = async () => {
    const on = await window.avToggleFav?.(favKey, { game: GAME_NAME[GAME.tab], key: i.key, name: i.name, image: i.image });
    $("fav-btn").classList.toggle("on", !!on); $("fav-btn").textContent = on ? "★" : "☆";
  };
}

let typing;
$("q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(render, 140); });
["cat", "sort"].forEach((id) => $(id).addEventListener("input", render));
// ranges are remembered per game in this browser
const RANGE_KEY = `ranges:${GAME.tab}`;
try { const r = JSON.parse(localStorage.getItem(RANGE_KEY) || "{}"); for (const k of ["vmin", "vmax", "pmin", "pmax", "lmin", "lmax"]) if (r[k] != null) $(k).value = r[k]; } catch { /* private mode */ }
const saveRanges = () => { try { localStorage.setItem(RANGE_KEY, JSON.stringify(Object.fromEntries(["vmin", "vmax", "pmin", "pmax", "lmin", "lmax"].map((k) => [k, $(k).value || null])))); } catch { /* ignore */ } };
["vmin", "vmax", "pmin", "pmax", "lmin", "lmax"].forEach((id) => $(id).addEventListener("input", () => { saveRanges(); render(); }));
$("ranges-clear").addEventListener("click", () => { ["vmin", "vmax", "pmin", "pmax", "lmin", "lmax"].forEach((id) => { $(id).value = ""; }); saveRanges(); render(); });
$("grid").addEventListener("pointermove", (e) => {
  const card = e.target.closest(".card"); if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty("--mx", `${e.clientX - r.left}px`);
  card.style.setProperty("--my", `${e.clientY - r.top}px`);
});
addEventListener("scroll", () => $("to-top").classList.toggle("show", scrollY > 600), { passive: true });
$("to-top").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
$("periods").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  period = b.dataset.p;
  $("periods").querySelectorAll("button[data-p]").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
load().then(() => { const want = new URLSearchParams(location.search).get("item"); if (want) openItem(want); });
setInterval(load, 5 * 60 * 1000);

// "Refresh now": values first (~15-30s), then Eldorado prices (this game's first, ~1 min; MM2 longer).
// Checks every 5s and redraws as each part arrives.
const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
async function waitFor(field, before, tries) {
  for (let i = 0; i < tries; i++) {
    await sleep(5000);
    const data = await fetch(GAME.api).then((x) => x.json()).catch(() => null);
    if (data?.[field] && data[field] !== before) return true;
  }
  return false;
}
$("refresh").addEventListener("click", async () => {
  const btn = $("refresh"), status = $("refresh-status");
  const done = (text) => { status.textContent = text; btn.disabled = false; setTimeout(() => { if (!btn.disabled) status.textContent = ""; }, 10000); };
  const valuesBefore = lastUpdatedAt, pricesBefore = lastPricesAt;
  btn.disabled = true;
  status.textContent = "Refreshing values… usually about 30 seconds";
  let r;
  try {
    r = await fetch(`/api/refresh-values?game=${encodeURIComponent(GAME.tab)}`, { method: "POST" }).then((x) => x.json());
    if (r.error) throw new Error(r.error);
  } catch {
    return done("Couldn't request a refresh — try again in a minute.");
  }
  if (r.recent) { await load(); return done("Already up to date ✓ (prices can be refreshed again a few minutes after the last time)"); }
  if (!(await waitFor("updatedAt", valuesBefore, 30))) return done("The values sites are slow right now — new values will appear in a moment.");
  await load();
  if (!r.prices) return done("Values updated ✓ (Eldorado prices were refreshed a few minutes ago)");
  status.textContent = "Values updated ✓ — updating Eldorado prices…";
  if (!(await waitFor("pricesUpdatedAt", pricesBefore, 120))) return done("Values updated ✓ — Eldorado prices are taking longer, they'll appear shortly.");
  await load();
  done("Values and Eldorado prices updated ✓");
});
</script>
