<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM2 Values · Limiteds Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg:#0b0e14; --surface:#12161f; --surface-2:#1a2029; --border:#262d3a;
    --text:#e9edf4; --muted:#8a93a6; --muted-2:#5d6577;
    --accent:#d9a441; --accent-soft:#d9a44122;
    --green:#34c17a; --red:#e0576a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f4ee; --surface:#ffffff; --surface-2:#f0ede4; --border:#ded8c8;
      --text:#221d12; --muted:#6b6455; --muted-2:#98917f;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Manrope", -apple-system, "Segoe UI", sans-serif; }
  .tabular { font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1200px; margin:auto; padding:0 16px; }
  header { border-bottom:1px solid var(--border); background:var(--surface); }
  .top { display:flex; align-items:center; gap:14px; padding:14px 0; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
  .brand-mark { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#1a1405; display:grid; place-items:center; font:700 15px "Unbounded", sans-serif; }
  .brand-text { font:600 16px "Unbounded", sans-serif; }
  .dim { color:var(--muted); }
  .tabs { display:flex; gap:8px; padding:14px 0 4px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:999px; border:1px solid var(--border); color:var(--muted); text-decoration:none; font-weight:700; font-size:13px; }
  .tab:hover { color:var(--text); border-color:var(--muted-2); }
  .tab.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; padding:12px 0; }
  input, select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font:inherit; }
  input { flex:1 1 220px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .stats { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; padding-bottom:10px; }
  .stats b { color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; padding-bottom:40px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; cursor:pointer; display:flex; gap:12px; }
  .card:hover { border-color:var(--accent); }
  .card img { width:64px; height:64px; object-fit:contain; flex:none; background:var(--surface-2); border-radius:10px; }
  .name { font-weight:800; }
  .cat { color:var(--muted); font-size:12px; text-transform:capitalize; }
  .val { font-size:17px; font-weight:700; margin-top:4px; color:var(--accent); }
  .chg { font-size:12px; }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:var(--muted-2); }
  dialog { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:16px; width:min(640px, calc(100% - 32px)); padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { font:600 18px "Unbounded", sans-serif; margin:0; }
  .dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0; }
  .dl dt { color:var(--muted); } .dl dd { margin:0; }
  svg.chart { width:100%; height:auto; display:block; background:var(--surface-2); border-radius:10px; touch-action:none; }
  svg.chart text { fill:var(--muted); font:11px "JetBrains Mono", monospace; }
  .chart-foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }
  .range-row { display:flex; gap:6px; margin-bottom:8px; }
  .range { background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:3px 10px; font:700 12px inherit; cursor:pointer; }
  .range.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .card { position:relative; }
  .val.ratio { font-size:14px; }
  .price { font-size:12px; margin-top:2px; color:var(--text); }
  .vpd { font-weight:700; }
  .periods { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding-bottom:10px; font-size:13px; }
  .periods button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:4px 12px; font:700 12px "Manrope", sans-serif; cursor:pointer; }
  .periods button.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .ptable { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:0 0 14px; }
  .ptable div { background:var(--surface-2); border-radius:10px; padding:8px; text-align:center; display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .ptable b { font-size:14px; }
  svg.spark { position:absolute; right:12px; bottom:12px; width:70px; height:30px; }
  .close { float:right; background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; }
  a { color:var(--accent); }
  .empty { color:var(--muted); padding:40px 16px; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/"><div class="brand-mark">L</div><div class="brand-text">Limiteds <span class="dim">Live</span></div></a>
  </div>
</header>
<div class="wrap">
  <nav class="tabs">
    <a class="tab" href="/">Tracker</a>
    <a class="tab" data-tab="mm2" href="/mm2">MM2 Values</a>
    <a class="tab" data-tab="bladeball" href="/bladeball">Blade Ball Values</a>
  </nav>
  <div class="controls">
    <input id="q" type="search" placeholder="Search…" autocomplete="off">
    <select id="cat"><option value="">All categories</option><option value="deals">🔥 Best deals</option></select>
    <select id="sort">
      <option value="value">Highest value</option>
      <option value="valueAsc">Lowest value</option>
      <option value="change">Biggest gain %</option>
      <option value="changeAsc">Biggest drop %</option>
      <option value="vpd">Best value per $</option>
      <option value="usdAsc">Cheapest on Eldorado</option>
      <option value="demand">Demand</option>
      <option value="name">Name</option>
    </select>
  </div>
  <div class="periods" id="periods">
    <span class="dim">Change:</span>
    <button data-p="24h">24h</button><button data-p="7d" class="on">7d</button><button data-p="30d">30d</button><button data-p="1y">1y</button><button data-p="all">All</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"><div class="empty">Loading values… (the server may be waking up, give it ~30s)</div></div>
</div>

<dialog id="dlg">
  <button class="close" onclick="dlg.close()" aria-label="Close">×</button>
  <div id="detail"></div>
</dialog>

<script>
/*GAME_CONFIG*/
const GAME = window.GAME || { api: "/api/mm2", title: "MM2 Values", tab: "mm2", noun: "MM2 weapons", sourceName: "supremevalues.com",
  sourceUrl: "https://supremevalues.com/mm2", shopUrl: "https://www.eldorado.gg/mm2-shop/i/204-2-0" };
document.title = `${GAME.title} · Limiteds Live`;
document.querySelectorAll(".tab[data-tab]").forEach((t) => t.classList.toggle("active", t.dataset.tab === GAME.tab));
document.getElementById("q").placeholder = `Search ${GAME.noun}…`;
let items = [];
let period = "7d";
let medianVpd = 0;
const usd = (n) => "$" + (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(2));
const fmtVpd = (n) => n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(1);
// Green = more value per dollar than the typical weapon, red = less.
const vpdClass = (n) => !medianVpd ? "" : n >= medianVpd * 1.25 ? "up" : n <= medianVpd * 0.75 ? "down" : "flat";
const PERIOD_LABEL = { "24h": "24h", "7d": "7 days", "30d": "30 days", "1y": "1 year", all: "all time" };
const chg = (i) => i.changes?.[period];
function changeText(c) {
  if (!c || !c.abs) return "No change";
  return `${c.abs > 0 ? "+" : ""}${fmt(c.abs)} (${c.pct > 0 ? "+" : ""}${c.pct}%)`;
}
const $ = (id) => document.getElementById(id);
const fmt = (n) => n == null ? "N/A" : n.toLocaleString();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cls = (n) => n > 0 ? "up" : n < 0 ? "down" : "flat";

async function load() {
  try {
    const data = await fetch(GAME.api).then((r) => r.json());
    items = data.items || [];
    if (!items.length) { $("grid").innerHTML = `<div class="empty">${esc(data.error || "No values yet.")}</div>`; return; }
    const vpds = items.map((i) => i.valuePerUsd).filter(Boolean).sort((a, b) => a - b);
    medianVpd = vpds.length ? vpds[vpds.length >> 1] : 0;
    const cat = $("cat");
    if (cat.options.length === 2) for (const c of data.categories) cat.add(new Option(c[0].toUpperCase() + c.slice(1), c));
    $("stats").innerHTML = `<span><b>${items.length}</b> items</span><span>Updated <b>${new Date(data.updatedAt).toLocaleTimeString()}</b></span><span>Values from <a href="${esc(GAME.sourceUrl)}" target="_blank" rel="noopener">${esc(data.source)}</a></span>${data.pricesUpdatedAt ? `<span>Prices from <a href="${esc(GAME.shopUrl)}" target="_blank" rel="noopener">Eldorado.gg</a> · ${new Date(data.pricesUpdatedAt).toLocaleTimeString()}</span><span>Typical: <b>${fmtVpd(medianVpd)}</b> value per $</span>` : ""}`;
    render();
  } catch (e) {
    $("grid").innerHTML = `<div class="empty">Couldn't load values: ${esc(e.message)}</div>`;
  }
}

function render() {
  const q = $("q").value.toLowerCase(), c = $("cat").value, s = $("sort").value;
  // "Best deals": more value per $ than the typical item (25%+ above the median), best first.
  const deals = c === "deals";
  const list = items.filter((i) => (!q || i.name.toLowerCase().includes(q))
    && (deals ? i.valuePerUsd >= medianVpd * 1.25 : !c || i.category === c));
  const v = (x) => x ?? -Infinity;
  const sorters = {
    value: (a, b) => v(b.value) - v(a.value), valueAsc: (a, b) => v(a.value) - v(b.value),
    change: (a, b) => v(chg(b)?.pct) - v(chg(a)?.pct), changeAsc: (a, b) => (chg(a)?.pct ?? 0) - (chg(b)?.pct ?? 0),
    demand: (a, b) => v(b.demand) - v(a.demand),
    vpd: (a, b) => v(b.valuePerUsd) - v(a.valuePerUsd), usdAsc: (a, b) => (a.usd ?? Infinity) - (b.usd ?? Infinity), name: (a, b) => a.name.localeCompare(b.name),
  };
  list.sort(deals && s === "value" ? sorters.vpd : sorters[s]);
  $("grid").innerHTML = list.length ? list.map((i) => `
    <div class="card" data-key="${esc(i.key)}">
      <img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.visibility='hidden'">
      <div>
        <div class="name">${esc(i.name)}</div>
        <div class="cat">${esc(i.category)} · ${esc(i.stability || "—")}</div>
        <div class="val tabular${i.valueText ? " ratio" : ""}">${i.valueText ? esc(i.valueText) : fmt(i.value)}</div>
        <div class="chg tabular ${cls(chg(i)?.abs)}">${i.valueText ? `<span class="dim">Trade value</span>` : `<span class="dim">${period}</span> ${changeText(chg(i))}`}</div>
        ${i.usd ? `<div class="price tabular">${usd(i.usd)} <span class="vpd ${vpdClass(i.valuePerUsd)}">${fmtVpd(i.valuePerUsd)} / $</span></div>` : ""}
      </div>
      ${spark(i.spark)}
    </div>`).join("") : `<div class="empty">Nothing matches.</div>`;
}

// Mini 90-day trend line on each card, coloured by direction.
function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const W = 70, H = 30, lo = Math.min(...vals), hi = Math.max(...vals);
  const pts = vals.map((v, k) => `${(k / (vals.length - 1) * W).toFixed(1)},${(H - 2 - (v - lo) / (hi - lo || 1) * (H - 4)).toFixed(1)}`).join(" ");
  const dir = vals[vals.length - 1] - vals[0];
  const color = dir > 0 ? "var(--green)" : dir < 0 ? "var(--red)" : "var(--muted-2)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

const RANGES = [["1M", 30], ["3M", 90], ["1Y", 365], ["All", 0]];
const shortNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n.toLocaleString();

function chartView(allPoints, days) {
  if (allPoints.length < 2) return `<p class="dim">No value history for this weapon yet.</p>`;
  let points = allPoints;
  if (days) {
    const cutoff = Date.now() - days * 864e5;
    const before = allPoints.filter((p) => p[0] < cutoff).pop();
    points = [...(before ? [[cutoff, before[1]]] : []), ...allPoints.filter((p) => p[0] >= cutoff)];
  }
  points = [...points, [Date.now(), points[points.length - 1][1]]]; // hold the current value up to today
  const W = 600, H = 220, L = 52, R = 10, T = 10, B = 26;
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 = Math.max(0, y0 * 0.9); y1 = y1 * 1.1 || 1; }
  const sx = (x) => L + (x - x0) / (x1 - x0 || 1) * (W - L - R);
  const sy = (y) => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let d = `M${sx(xs[0])},${sy(ys[0])}`;
  for (let k = 1; k < points.length; k++) d += `H${sx(xs[k])}V${sy(ys[k])}`; // step: value holds until it changes
  const area = `${d}V${H - B}H${sx(xs[0])}Z`;
  const grid = [0, 0.5, 1].map((f) => {
    const v = y0 + (y1 - y0) * f, y = sy(v);
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${shortNum(Math.round(v))}</text>`;
  }).join("");
  const dfmt = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: days && days <= 90 ? undefined : "2-digit" });
  const first = ys[0], last = ys[ys.length - 1], pct = first ? (last - first) / first * 100 : 0;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-x0="${x0}" data-x1="${x1}">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#g)"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="${L}" y="${H - 6}">${dfmt(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text>
      <line id="cursor" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    </svg>
    <div class="chart-foot tabular"><span id="hover-read">${shortNum(first)} → ${shortNum(last)}</span><span class="${cls(pct)}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span></div>`;
}

function mountChart(points) {
  let days = 365;
  const draw = () => {
    $("hist").innerHTML = `<div class="range-row">${RANGES.map(([l, n]) => `<button class="range${n === days ? " on" : ""}" data-days="${n}">${l}</button>`).join("")}</div>${chartView(points, days)}`;
    const svg = $("hist").querySelector("svg.chart"); if (!svg) return;
    const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, read = $("hover-read"), base = read.textContent, cursor = svg.querySelector("#cursor");
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * 600;
      const t = x0 + Math.min(1, Math.max(0, (fx - 52) / (600 - 62))) * (x1 - x0);
      const p = points.filter((q) => q[0] <= t).pop() || points[0];
      cursor.setAttribute("x1", Math.max(52, fx)); cursor.setAttribute("x2", Math.max(52, fx)); cursor.setAttribute("visibility", "visible");
      read.textContent = `${new Date(t).toLocaleDateString()} · ${p[1].toLocaleString()}`;
    });
    svg.addEventListener("pointerleave", () => { cursor.setAttribute("visibility", "hidden"); read.textContent = base; });
  };
  $("hist").onclick = (e) => { const b = e.target.closest(".range"); if (b) { days = +b.dataset.days; draw(); } };
  draw();
}

$("grid").addEventListener("click", async (e) => {
  const card = e.target.closest(".card"); if (!card) return;
  const i = items.find((x) => x.key === card.dataset.key);
  $("detail").innerHTML = `<h2>${esc(i.name)}</h2><div class="cat">${esc(i.category)}</div>
    <dl class="dl"><dt>Value</dt><dd class="tabular">${i.valueText ? esc(i.valueText) : fmt(i.value)}</dd><dt>Range</dt><dd>${esc(i.range || "N/A")}</dd>
    <dt>Stability</dt><dd>${esc(i.stability || "N/A")}</dd><dt>Demand</dt><dd>${fmt(i.demand)}</dd>
    <dt>Rarity</dt><dd>${fmt(i.rarity)}</dd>
    ${i.usd ? `<dt>Eldorado</dt><dd class="tabular">${usd(i.usd)} cheapest · ${fmt(i.listings)} listings · <a href="${esc(i.eldoradoUrl)}" target="_blank" rel="noopener">view</a></dd>
    <dt>Value per $</dt><dd class="tabular ${vpdClass(i.valuePerUsd)}">${fmtVpd(i.valuePerUsd)} <span class="dim">(typical ${fmtVpd(medianVpd)})</span></dd>` : ""}<dt>Origin</dt><dd>${esc(i.origin || "N/A")}</dd>
    </dl>
    ${i.valueText ? `<p class="dim">This item is valued as a trade ratio, so there's no number to chart.</p>` : `<div class="ptable">${Object.keys(PERIOD_LABEL).map((p) => `<div><span class="dim">${p === "all" ? "All" : p}</span><b class="tabular ${cls(i.changes?.[p]?.abs)}">${i.changes?.[p] ? (i.changes[p].pct > 0 ? "+" : "") + i.changes[p].pct + "%" : "—"}</b></div>`).join("")}</div>`}
    <div id="hist" class="dim">Loading history…</div>
    <p><a href="${esc(i.sourceUrl)}" target="_blank" rel="noopener">View on Supreme Values</a></p>`;
  $("dlg").showModal();
  if (i.valueText) { $("hist").innerHTML = ""; return; }
  const h = await fetch(GAME.api + "/history?key=" + encodeURIComponent(i.key)).then((r) => r.json()).catch(() => ({ points: [] }));
  mountChart(h.points);
});

["q", "cat", "sort"].forEach((id) => $(id).addEventListener("input", render));
$("periods").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  period = b.dataset.p;
  $("periods").querySelectorAll("button[data-p]").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
